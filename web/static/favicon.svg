<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- hair gradient: gold palette -->
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- face soft radial -->
    <radialGradient id="face" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="100%" stop-color="#ffe6f0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- hair mass -->
    <circle cx="32" cy="30" r="28" fill="url(#hair)"/>
    <!-- twin bun hints -->
    <circle cx="14" cy="24" r="7" fill="#f59e0b" opacity=".9"/>
    <circle cx="50" cy="24" r="7" fill="#fbbf24" opacity=".9"/>
    <!-- face -->
    <circle cx="32" cy="38" r="18" fill="url(#face)"/>
    <!-- bangs (simple curved strip) -->
    <path d="M8 26 C 18 14, 46 14, 56 26 C 52 24, 44 24, 32 28 C 20 24, 12 24, 8 26 Z" fill="#d97706" opacity=".85"/>
    <!-- hair clip star -->
    <path d="M48 22 l2 -3 l2 3 l3 1.2 l-3 1.2 l-2 3 l-2 -3 l-3 -1.2 z" fill="#fde047" opacity=".95"/>
    <!-- eyes -->
    <ellipse cx="25" cy="39" rx="3.6" ry="5" fill="#1b1030"/>
    <ellipse cx="39" cy="39" rx="3.6" ry="5" fill="#1b1030"/>
    <circle cx="23.8" cy="37.2" r="1.0" fill="#fff"/>
    <circle cx="37.8" cy="37.2" r="1.0" fill="#fff"/>
    <!-- blush -->
    <circle cx="19.2" cy="44" r="2.1" fill="#f9a8d4" opacity=".8"/>
    <circle cx="44.8" cy="44" r="2.1" fill="#f9a8d4" opacity=".8"/>
    <!-- mouth -->
    <path d="M26 48 Q 32 51.5 38 48" fill="none" stroke="#ea5a8b" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
