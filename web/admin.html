<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>后台总览 - ELO</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <header class="site-header">
    <h1>Realtime Leaderboard</h1>
    <nav>
      <a href="/compare.html">Compare</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div class="actions">
        <button class="btn" id="btnRefresh">Refresh</button>
        <button class="btn" id="btnReload">Reload</button>
        <a class="btn" href="/api/export">Export CSV</a>
        <span id="status" class="msg"></span>
      </div>
      <div class="settings">
        <label>Initial rating: <input id="initRating" type="number" step="1" min="0" style="width:100px"></label>
        <label style="margin-left:8px">K factor: <input id="kFactor" type="number" step="1" min="1" style="width:80px"></label>
        <button class="btn" id="btnApplyCfg">Apply</button>
        <button class="btn" id="btnResetAll">Reset All</button>
        <span id="cfgMsg" class="msg"></span>
      </div>
      <div class="chart-block">
        <div class="chart-title">ELO by Model</div>
        <canvas id="barChart" height="240"></canvas>
      </div>
      <div class="chart-block">
        <div class="chart-title">Top-5 ELO Over Time</div>
        <canvas id="lineChart" height="260"></canvas>
      </div>
      <table class="ratings-table" id="ratingsTable">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Preview</th>
            <th>Model</th>
            <th>ELO</th>
            <th>Appearances</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/admin.js"></script>
</body>
</html>
