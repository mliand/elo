<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ELO 图片评估工具</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <header class="site-header">
    <h1>ELO 图片评估工具</h1>
    <nav>
      <a href="/rt.html">实时生成对比</a>
      <a href="/compare.html">本地图片对比</a>
      <a href="/admin.html">后台总览</a>
    </nav>
  </header>

  <main class="container">
    <section class="card" style="padding: 28px;">
      <h2 style="margin-top:0">欢迎</h2>
      <p style="color:#b9c9ef">本工具用于本地 ELO 评分与图片标注，强调蓝色调与简洁体验。</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 8px;">
        <a class="btn primary" href="/rt.html">开始实时生成对比</a>
        <a class="btn" href="/compare.html">本地图片对比</a>
      </div>
      <ul>
        <li>前端：原生网页 + 蓝色玻璃拟态风格</li>
        <li>后端：Python 标准库 HTTP + SSE 实时更新</li>
        <li>功能：从本地 A/B 目录自动检测同名图片，进行对比与导出 CSV</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">本地运行 · 无需外网</footer>
</body>
</html>
