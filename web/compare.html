<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片对比 - ELO</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <header class="site-header">
    <h1></h1>
    <nav></nav>
  </header>

  <main class="container">
    <section class="card animate-fade-up">
      <div class="prompt-banner" id="currentPrompt" title="Prompt"></div>
      <div class="pair-container">
        <div class="img-col">
          <div class="side-label">Left image</div>
          <div class="img-wrap" id="wrapA">
            <img id="imgA" alt="A" class="swap-target" />
          </div>
          <button class="btn primary" id="btnA">Select Left (A)</button>
        </div>
        <div class="img-col">
          <div class="side-label">Right image</div>
          <div class="img-wrap" id="wrapB">
            <img id="imgB" alt="B" class="swap-target" />
          </div>
          <button class="btn primary" id="btnB">Select Right (B)</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnTie">Tie</button>
        <button class="btn" id="btnNext">Next Pair</button>
        <span id="msg" class="msg"></span>
      </div>
    </section>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/compare.js"></script>
</body>
</html>
