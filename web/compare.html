<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片对比 - ELO</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>图片对比打分</h1>
    <nav>
      <a href="/index.html">首页</a>
      <a href="/annotate.html">图片标注</a>
      <a href="/admin.html">后台总览</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div class="pair-container">
        <div class="img-col">
          <div class="img-wrap" id="wrapA">
            <img id="imgA" alt="A" />
          </div>
          <div class="meta" id="metaA"></div>
          <button class="btn primary" id="btnA">选择左侧 (A)</button>
        </div>
        <div class="img-col">
          <div class="img-wrap" id="wrapB">
            <img id="imgB" alt="B" />
          </div>
          <div class="meta" id="metaB"></div>
          <button class="btn primary" id="btnB">选择右侧 (B)</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnTie">平局</button>
        <button class="btn" id="btnNext">换一对</button>
        <span id="msg" class="msg"></span>
      </div>
    </section>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/compare.js"></script>
</body>
</html>
